<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background: #000; color: #00ff41; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; position: relative; }
        
        /* Matrix Rain Canvas background */
        #matrix-bg { position: fixed; inset: 0; z-index: 1; opacity: 0.35; pointer-events: none; }

        /* Secure Password Gate */
        #login-screen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100; transition: 0.5s; backdrop-filter: blur(3px); }
        .login-card { background: rgba(0, 20, 5, 0.4); padding: 40px; border-radius: 4px; border: 1px solid #00ff41; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
        .input-group { margin-bottom: 25px; text-align: center; }
        .input-group input { width: 100%; padding: 14px; background: #000; border: 1px solid #00ff41; border-radius: 4px; color: #00ff41; outline: none; text-align: center; font-size: 18px; letter-spacing: 3px; font-weight: bold; box-shadow: inset 0 0 5px rgba(0, 255, 65, 0.5); }
        .input-group input:focus { box-shadow: 0 0 10px #00ff41, inset 0 0 5px #00ff41; }
        .login-btn { width: 100%; padding: 14px; background: #00ff41; border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 15px; letter-spacing: 2px; }
        .login-btn:hover { background: #003311; color: #00ff41; border: 1px solid #00ff41; box-shadow: 0 0 15px #00ff41; }
        
        /* Main Portal Dashboard */
        #portal-dashboard { width: 100%; max-width: 1200px; padding: 40px 20px; display: none; opacity: 0; transition: 0.5s; z-index: 2; position: relative; }
        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 36px; letter-spacing: 4px; text-shadow: 0 0 10px #00ff41; color: #00ff41; margin-bottom: 10px; }
        header p { color: #008f11; font-size: 14px; }
        
        /* 3D App Grid */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-top: 30px; perspective: 1000px; }
        .portal-card { background: rgba(0, 10, 2, 0.6); border: 1px solid #008f11; padding: 35px 20px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s ease; transform-style: preserve-3d; transform: rotateX(8deg); }
        .portal-card:hover { transform: rotateX(0deg) scale(1.05) translateY(-5px); border-color: #00ff41; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); background: rgba(0, 25, 5, 0.8); }
        
        .card-icon { font-size: 40px; margin-bottom: 15px; display: inline-block; filter: drop-shadow(0 0 5px #00ff41); }
        .portal-card h3 { font-size: 20px; margin-bottom: 10px; font-weight: bold; color: #00ff41; letter-spacing: 1px; }
        .portal-card p { font-size: 13px; color: #008f11; }
    </style>
</head>
<body>

    <!-- Matrix Code Stream Canvas -->
    <canvas id="matrix-bg"></canvas>

    <!-- Invisible Gateway -->
    <div id="login-screen">
        <div class="login-card">
            <div class="input-group">
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="login-btn" onclick="tryLogin()">EXECUTE</button>
        </div>
    </div>

    <!-- Main Grid System -->
    <div id="portal-dashboard">
        <header>
            <h1>INDEXHUBBY_MAINFRAME</h1>
            <p>[SYSTEM STATUS: SECURE DEPLOYMENT TERMINAL ON_V1.0.6]</p>
        </header>

        <div class="grid-container">
            <div class="portal-card" onclick="alert('Routing secure web link to WhatsApp...')">
                <span class="card-icon">💬</span>
                <h3>WhatsApp</h3>
                <p>SYS_LINK_COMM</p>
            </div>
            <div class="portal-card" onclick="alert('Routing secure web link to TikTok...')">
                <span class="card-icon">🎵</span>
                <h3>TikTok</h3>
                <p>SYS_LINK_STREAM</p>
            </div>
            <div class="portal-card" onclick="alert('Routing secure web link to Roblox...')">
                <span class="card-icon">🎮</span>
                <h3>Roblox</h3>
                <p>SYS_LINK_SANDBOX</p>
            </div>
            <div class="portal-card" onclick="alert('Routing secure web link to YouTube...')">
                <span class="card-icon">📺</span>
                <h3>YouTube</h3>
                <p>SYS_LINK_MEDIA</p>
            </div>
            <div class="portal-card" onclick="alert('Decrypting arcade code library...')">
                <span class="card-icon">🕹️</span>
                <h3>Gaming Vault</h3>
                <p>SYS_LINK_GAMES</p>
            </div>
        </div>
    </div>

    <script>
        // Matrix Background Script
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";
        const alphabet = letters.split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // Security Core
        function tryLogin() {
            const pass = document.getElementById('password').value;
            if(pass === "indexhubby") {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    const dash = document.getElementById('portal-dashboard');
                    dash.style.display = 'block';
                    setTimeout(() => dash.style.opacity = '1', 50);
                }, 500);
            } else {
                alert("CRITICAL ERROR: ACCESS DENIED.");
                document.getElementById('password').value = "";
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') tryLogin();
        });
    </script>
</body>
</html>
