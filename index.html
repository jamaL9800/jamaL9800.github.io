<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background: #000; color: #00ff41; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        #matrix-bg { position: fixed; inset: 0; z-index: 1; opacity: 0.25; pointer-events: none; }

        #login-screen { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-card { width: 100%; max-width: 300px; text-align: center; }
        .input-group input { width: 100%; padding: 14px; background: #000; border: 1px solid #00ff41; color: #00ff41; outline: none; text-align: center; font-size: 18px; font-weight: bold; }
        .login-btn { width: 100%; padding: 14px; background: #00ff41; border: none; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; margin-top: 20px; }
        .login-btn:hover { background: #000; color: #00ff41; border: 1px solid #00ff41; }
        
        #portal-dashboard { width: 100%; max-width: 1400px; padding: 40px 20px; display: none; z-index: 2; position: relative; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 36px; letter-spacing: 4px; text-shadow: 0 0 10px #00ff41; color: #00ff41; margin-bottom: 10px; }
        header p { color: #008f11; font-size: 14px; }
        
        .section-title { font-size: 18px; color: #00ff41; margin: 40px 0 15px; border-bottom: 1px solid #008f11; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .portal-card { background: rgba(0, 10, 2, 0.9); border: 1px solid #008f11; padding: 25px 10px; border-radius: 4px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .portal-card:hover { border-color: #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); transform: translateY(-2px); }
        
        .card-icon { font-size: 32px; margin-bottom: 10px; display: inline-block; filter: drop-shadow(0 0 3px #00ff41); }
        .portal-card h3 { font-size: 14px; font-weight: bold; color: #00ff41; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .portal-card p { font-size: 11px; color: #008f11; margin-top: 4px; }

        #game-container { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
        #game-frame { width: 100%; height: calc(100% - 40px); border: none; background: #000; }
        .frame-bar { height: 40px; background: #111; border-top: 1px solid #00ff41; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .frame-btn { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 4px 14px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .frame-btn:hover { background: #00ff41; color: #000; }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="login-screen">
        <div class="login-card">
            <div class="input-group">
                <input type="password" id="password" autocomplete="off">
            </div>
            <button class="login-btn" onclick="tryLogin()">EXECUTE</button>
        </div>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src=""></iframe>
        <div class="frame-bar">
            <button class="frame-btn" onclick="closeGame()">➔ EXIT APP</button>
            <button class="frame-btn" onclick="toggleFullscreen()">🖵 FULLSCREEN</button>
        </div>
    </div>

    <div id="portal-dashboard">
        <header>
            <h1>MAINFRAME</h1>
            <p>[SYSTEM ENHANCED CORE: 45+ ACTIVE WEB PORTS ONLINE]</p>
        </header>

        <div class="section-title">Communication Systems & Core Portals</div>
        <div class="grid-container" id="apps-grid"></div>

        <div class="section-title">In-Site Web Arcade & 3D Sandbox Vault</div>
        <div class="grid-container" id="games-grid"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";
        const alphabet = letters.split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        const communicationApps = [
            { name: "WhatsApp", icon: "💬", url: "https://whatsapp.com" },
            { name: "TikTok", icon: "🎵", url: "https://tiktok.com" },
            { name: "YouTube", icon: "📺", url: "https://youtube.com" },
            { name: "Roblox", icon: "🎮", url: "https://roblox.com" },
            { name: "Omegle Proxy", icon: "🌐", url: "https://chateek.com" },
            { name: "Snapchat Web", icon: "👻", url: "https://snapchat.com" }
        ];

        const hardwareGames = [
            { name: "Granny Remake 3D", icon: "👵", url: "https://gamedistribution.com" },
            { name: "Baldi Basics Edition", icon: "📐", url: "https://gamedistribution.com" },
            { name: "Minecraft Web Engine", icon: "⛏️", url: "https://vseigru.net" },
            { name: "Roblox Block Open World", icon: "🧱", url: "https://gamedistribution.com" },
            { name: "Pixel Craft 3D", icon: "📦", url: "https://gamedistribution.com" },
            { name: "Voxel Sandbox 3D Universe", icon: "🌏", url: "https://gamedistribution.com" },
            { name: "Realistic 3D Moto Stunts", icon: "🏍️", url: "https://gamedistribution.com" },
            { name: "Advanced Combat 3D Shooter", icon: "🔫", url: "https://gamedistribution.com" }
        ];

        const titlesPool = [
            "Hyper Drift 3D", "Cyber City Racer", "Matrix Horizon 3D", "Voxel Strike Force", "Core Velocity", 
            "Neon Runner 3D", "Retro Terminal Asteroids", "Command Line Tank Arena", "Space Vortex Flight", "Grid Core Breaker"
        ];
        
        for(let i = 1; i <= 40; i++) {
            const template = titlesPool[i % titlesPool.length];
            hardwareGames.push({
                name: `${template} v${i}.4`,
                icon: "🕹️",
                url: `https://gamedistribution.com?title=node-${i}`
            });
        }

        const appsGrid = document.getElementById('apps-grid');
        communicationApps.forEach(app => {
            appsGrid.innerHTML += `
                <div class="portal-card" onclick="window.open('${app.url}', '_blank')">
                    <span class="card-icon">${app.icon}</span>
                    <h3>${app.name}</h3>
                    <p>CORE_REDIRECT</p>
                </div>`;
        });

        const gamesGrid = document.getElementById('games-grid');
        hardwareGames.forEach(game => {
            gamesGrid.innerHTML += `
                <div class="portal-card" onclick="launchApp('${game.url}')">
                    <span class="card-icon">${game.icon}</span>
                    <h3>${game.name}</h3>
                    <p>SANDBOX_EMU</p>
                </div>`;
        });

        function launchApp(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-container').style.display = 'flex';
        }
        function closeGame() {
            document.getElementById('game-frame').src = "";
            document.getElementById('game-container').style.display = 'none';
        }
        function toggleFullscreen() {
            const el = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                el.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function tryLogin() {
            const entry = document.getElementById('password').value;
            if(entry === "indexhubby") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('portal-dashboard').style.display = 'block';
            } else {
                document.getElementById('password').value = "";
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                tryLogin();
            }
        });
    </script>
</body>
</html>
