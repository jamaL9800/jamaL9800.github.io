<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background: #000; color: #00ff41; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        #matrix-bg { position: fixed; inset: 0; z-index: 1; opacity: 0.35; pointer-events: none; }

        #login-screen { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; transition: 0.4s; }
        .login-card { width: 100%; max-width: 300px; text-align: center; }
        .input-group input { width: 100%; padding: 14px; background: #000; border: 1px solid #00ff41; color: #00ff41; outline: none; text-align: center; font-size: 18px; font-weight: bold; }
        .login-btn { width: 100%; padding: 14px; background: #00ff41; border: none; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; margin-top: 20px; }
        .login-btn:hover { background: #000; color: #00ff41; border: 1px solid #00ff41; }
        
        #portal-dashboard { width: 100%; max-width: 1200px; padding: 40px 20px; display: none; opacity: 0; transition: 0.5s; z-index: 2; position: relative; }
        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 36px; letter-spacing: 4px; text-shadow: 0 0 10px #00ff41; color: #00ff41; margin-bottom: 10px; }
        header p { color: #008f11; font-size: 14px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-top: 30px; perspective: 1000px; }
        .portal-card { background: rgba(0, 10, 2, 0.8); border: 1px solid #008f11; padding: 35px 20px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s ease; transform-style: preserve-3d; transform: rotateX(8deg); }
        .portal-card:hover { transform: rotateX(0deg) scale(1.05) translateY(-5px); border-color: #00ff41; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }
        
        .card-icon { font-size: 40px; margin-bottom: 15px; display: inline-block; filter: drop-shadow(0 0 5px #00ff41); }
        .portal-card h3 { font-size: 20px; margin-bottom: 10px; font-weight: bold; color: #00ff41; letter-spacing: 1px; }
        .portal-card p { font-size: 13px; color: #008f11; }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="login-screen">
        <div class="login-card">
            <div class="input-group">
                <input type="password" id="password" autocomplete="off">
            </div>
            <button class="login-btn" onclick="tryLogin()">EXECUTE</button>
        </div>
    </div>

    <div id="portal-dashboard">
        <header>
            <h1>MAINFRAME</h1>
            <p>[SYSTEM ONLINE]</p>
        </header>

        <div class="grid-container">
            <div class="portal-card" onclick="alert('CONNECTING...')">
                <span class="card-icon">💬</span>
                <h3>WhatsApp</h3>
                <p>PORT_1</p>
            </div>
            <div class="portal-card" onclick="alert('CONNECTING...')">
                <span class="card-icon">🎵</span>
                <h3>TikTok</h3>
                <p>PORT_2</p>
            </div>
            <div class="portal-card" onclick="alert('CONNECTING...')">
                <span class="card-icon">🎮</span>
                <h3>Roblox</h3>
                <p>PORT_3</p>
            </div>
            <div class="portal-card" onclick="alert('CONNECTING...')">
                <span class="card-icon">📺</span>
                <h3>YouTube</h3>
                <p>PORT_4</p>
            </div>
            <div class="portal-card" onclick="alert('CONNECTING...')">
                <span class="card-icon">🕹️</span>
                <h3>Gaming Vault</h3>
                <p>PORT_5</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";
        const alphabet = letters.split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        function tryLogin() {
            const pass = document.getElementById('password').value;
            if(pass === "indexhubby") {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    const dash = document.getElementById('portal-dashboard');
                    dash.style.display = 'block';
                    setTimeout(() => dash.style.opacity = '1', 50);
                }, 400);
            } else {
                document.getElementById('password').value = "";
            }
        }
        document.getElementById('password').addEventListener('keypress', function(e) { if (e.key === 'Enter') tryLogin(); });
    </script>
</body>
</html>
